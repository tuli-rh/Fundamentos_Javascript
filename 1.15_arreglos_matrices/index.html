<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arreglos y Matices</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Arreglos y Matrices</h1>

        <section>
            <!-- Ejercicio 1: Frase a partir de un arreglo de palabras -->
            <button onclick="fraseArreglo()">Frase a partir de un arreglo</button>
            <!-- Ejercicio 2: Construir frase con número, verbo, adverbio, adjetivo y sustantivo -->
            <button onclick="construirFrase()">Construir frase</button>
            <!-- Ejercicio 3: Suma de dos elementos en una matriz de dos dimensiones -->
            <button onclick="sumaElementos()">Suma de dos elementos</button>
        </section>
        <br>
        <section>
            <!-- Ejercicio 4: Suma de dos valores en una matriz de tres niveles -->
             <button onclick="sumaValores()">Suma de dos valores</button>
             <!-- Ejercicio 5: Construir frase usando datos de arreglo + matriz -->
              <button onclick="frase()">Construir frase</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
